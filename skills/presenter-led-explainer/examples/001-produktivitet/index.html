<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<title>Avsnitt 1: Varför syns inte AI i siffrorna?</title>
<link rel="stylesheet" href="runtime/vendor/dist/reset.css">
<link rel="stylesheet" href="runtime/vendor/dist/reveal.css">
<style>
html,body{background:#fff}
.reveal .slides section{padding:0;height:100%;width:100%;text-align:left}
.reveal iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;pointer-events:none;background:#fff}
#pts{display:none;position:fixed;left:16px;bottom:16px;max-width:42vw;background:rgba(42,36,32,.92);color:#fff;font:600 20px/1.35 Kalam,cursive,sans-serif;padding:14px 18px;border-radius:12px;z-index:9}
#pts b{color:#F07A1A} #pts div{margin-top:6px}
</style></head>
<body>
<div class="reveal"><div class="slides">
<section data-scene="scenes/s01.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/intro.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s02.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s03.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s04.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s05.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s06.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s07.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s08.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s09.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s10.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s11.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/s12.html"><iframe tabindex="-1"></iframe></section>
<section data-scene="scenes/outro.html"><iframe tabindex="-1"></iframe></section>
</div></div>
<div id="pts"></div>
<script src="runtime/vendor/dist/reveal.js"></script>
<script>
const NOTES = [["Frågan","Alla blir snabbare med AI.","Ändå syns det inte i siffrorna."],["Det här är jag","DRAFT: Hej, jag heter César Forthomme.","DRAFT: Systemutvecklare, bygger med AI-agenter varje dag.","DRAFT: Driver Lagom AI: AI begripligt och användbart för alla.","DRAFT: Svenska förklaringar av AI, en fråga per video.","DRAFT: I dag: varför syns inte AI i siffrorna?"],["Riksbanken","41 av Sveriges största företag.","Nästan alla använder AI.","Effekten än så länge liten.","Det har ett namn: produktivitetsparadoxen."],["Teamet som ett band","Varje ändring är ett paket.","Utvecklare → granskning → test → godkännande → användare."],["AI-kollegan","Utvecklarna får en AI-kollega.","Paketen flyger iväg från skärmen, snabbare och snabbare."],["Flaskhalsen","Paketen hinner iväg, men användarna väntar lika länge.","Kö framför granskning, test, godkännande.","Flödet går aldrig fortare än sitt långsammaste steg.","Teorin om begränsningar, Goldratt, Målet (1984)."],["Ångfabriken","Paul David: elen kom runt 1900.","En ångmaskin, en axel i taket, remmar till varje maskin.","Därför fabriker på höjden."],["Elmotorn i den gamla fabriken","Bytte ångmaskinen mot en elmotor, axeln satt kvar.","Inget lyft.","Under 5 % el 1899, ungefär hälften 20 år senare."],["Den nya fabriken","En liten motor i varje maskin.","Ett plan, maskinerna i flödesordning.","Lyftet på 1920-talet – inte motorn, utan fabriken."],["Datorerna","Solow 1987: syns överallt utom i statistiken.","Dator på varje bord, men blanketter, pärmar och stämplar kvar.","Skriv ut, skriv in igen."],["Kontoren byggs om","Produktiviteten i USA tog fart sent 90-tal.","Brynjolfsson och Hitt: lyftet kom hos de som byggde om arbetet.","Färre mellansteg, beslut närmare jobbet."],["J-kurvan","Tid längs botten, produktivitet uppåt.","Ny teknik: man kunde tro att linjen går rakt upp.","Men först går den ner. En svacka."],["J-kurvan: uppförsbacken","Tid och pengar går till sådant som inte syns: lära om, bygga om.","När det nya arbetssättet sitter vänder kurvan och stiger brant.","Först syns kostnaden, nyttan kommer efter.","El, datorer – nu står AI i början."],["Avslutning","DRAFT: Ett snabbare steg ger inte snabbare arbete – lyftet kommer när arbetet byggs om runt AI.","DRAFT: Jag heter César, och det här var Lagom AI. Vi ses i nästa video.","DRAFT: Nästa video: [teaser kommer].","DRAFT (valfritt): Länk i beskrivningen."]];
Reveal.initialize({width:1920,height:1080,margin:0,hash:true,controls:false,progress:false,transition:'fade',slideNumber:false,fragments:false});
// on a wide screen the 16:9 stage is pinned to the left edge, so the free strip on the right is where the webcam bubble sits and the
// presenter's face never covers the picture. ?align=center brings Reveal's centred layout back. Reveal re-centres on every layout, so redo it after each.
const pinLeft = () => { if (new URLSearchParams(location.search).get('align') === 'center') return;
  const sl = document.querySelector('.reveal .slides'); if (!sl) return;
  const t = 'translate(0px, -50%) scale(' + Reveal.getScale() + ')';
  if (sl.style.transform !== t || sl.style.left !== '0px') { sl.style.left = '0px'; sl.style.transformOrigin = '0 50%'; sl.style.transform = t; } };
const all = () => [...document.querySelectorAll('.slides > section')];
const frame = s => s && s.querySelector('iframe');
function load(s) { const f = frame(s); if (f && !f.src.includes('scenes/')) { f.addEventListener('load', () => { f.dataset.ready = 1; }); f.src = s.dataset.scene; } return f; }
const tell = (f, type) => f && f.contentWindow && f.contentWindow.postMessage({type}, '*');
// the shown slide starts its animation; every other slide is paused
function enter(cur) {
  all().forEach(s => { const f = frame(s); if (s !== cur && f && f.dataset.ready) tell(f, 'leave'); });
  const f = load(cur); if (!f) return;
  if (f.dataset.ready) tell(f, 'enter'); else f.addEventListener('load', () => tell(f, 'enter'), {once: true});
}
function near() { const a = all(), i = a.indexOf(Reveal.getCurrentSlide()); [a[i], a[i + 1]].forEach(s => s && load(s)); }
// speaker notes: key N = separate window (not recorded), key T = on the slide
let popup = null;
function notes() { const i = all().indexOf(Reveal.getCurrentSlide());
  const html = NOTES[i].map((t, j) => j === 0 ? '<b>' + t + '</b>' : '<div>' + j + '. ' + t + '</div>').join('');
  document.getElementById('pts').innerHTML = html;
  if (popup && !popup.closed) popup.document.body.innerHTML = html; }
function openNotes() { popup = window.open('', 'notes', 'width=560,height=640'); if (!popup) return;
  popup.document.title = 'Notes'; popup.document.head.innerHTML = '<style>body{font:600 28px/1.4 Kalam,"Comic Sans MS",cursive;background:#2A2420;color:#fff;padding:20px}b{color:#F07A1A;font-size:34px}div{margin-top:14px}</style>'; notes(); }
Reveal.on('ready', e => { pinLeft(); near(); enter(e.currentSlide); notes(); });
Reveal.on('resize', pinLeft);
new MutationObserver(pinLeft).observe(document.querySelector('.reveal .slides'), {attributes: true, attributeFilter: ['style']});
Reveal.on('slidechanged', e => { near(); enter(e.currentSlide); notes(); });
addEventListener('keydown', e => { if (e.key === 'n' || e.key === 'N') { e.preventDefault(); e.stopPropagation(); openNotes(); }
  if (e.key === 't' || e.key === 'T') { const p = document.getElementById('pts'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; } }, true);
</script>
<script src="runtime/recorder.js"></script>
</body></html>
