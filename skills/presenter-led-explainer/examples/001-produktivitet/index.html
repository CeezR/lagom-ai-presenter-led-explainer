<script src="runtime/vendor/dist/reveal.js"></script>
<script>
const POINTS = [["Frågan","Alla blir snabbare med AI – syns inte i siffrorna.","Det kallas produktivitetsparadoxen."],["Riksbanken","41 av Sveriges största företag.","Nästan alla använder AI.","Effekten än så länge liten."],["Teamet som ett band","Varje ändring är ett paket.","Utvecklare → granskning → test → godkännande → användare."],["AI-kollegan","Utvecklarna får AI, paketen flyger iväg.","Men användarna väntar lika länge."],["Flaskhalsen","Kö framför granskning, test, godkännande.","Flödet går aldrig fortare än sitt långsammaste steg.","Theory of Constraints, Goldratt, The Goal (1984)."],["Ångfabriken","Paul David: elen kom runt 1900.","En ångmaskin, en axel i taket, remmar till varje maskin.","Därför fabriker på höjden."],["Elmotorn i den gamla fabriken","Bytte ångmaskinen mot en elmotor, axeln satt kvar.","Inget lyft.","Under 5 % el 1899, ungefär hälften 20 år senare."],["Den nya fabriken","En liten motor i varje maskin.","Ett plan, maskinerna i flödesordning.","Lyftet på 1920-talet – inte motorn, utan fabriken."],["Datorerna","Solow 1987: syns överallt utom i statistiken.","Dator på varje bord, men blanketter, pärmar och stämplar kvar.","Skriv ut, skriv in igen."],["Kontoren byggs om","Produktiviteten i USA tog fart sent 90-tal.","Brynjolfsson och Hitt: lyftet kom hos de som byggde om arbetet.","Färre mellansteg, beslut närmare jobbet."],["J-kurvan","Tid längs botten, produktivitet uppåt.","Ny teknik: man kunde tro att linjen går rakt upp.","Men först går den ner. En svacka."],["J-kurvan: uppförsbacken","Tid och pengar går till sådant som inte syns: lära om, bygga om.","När det nya arbetssättet sitter vänder kurvan och stiger brant.","Först syns kostnaden, nyttan kommer efter.","El, datorer – nu står AI i början."],["Tillbaka till teamet","Teamet har fått sin elmotor.","Men bandet är byggt för den gamla farten, som axeln i taket.","Det som räknas är vad som kommer fram."]];
Reveal.initialize({width:1920,height:1080,margin:0,hash:true,controls:false,progress:false,transition:'fade',slideNumber:false,fragments:true});
const frame = s => s && s.querySelector('iframe');
const shown = s => s.querySelectorAll('.fragment.visible').length;
const all = () => [...document.querySelectorAll('.slides > section')];
function load(s) { const f = frame(s); if (f && !f.src.includes('scenes/')) f.src = s.dataset.scene; return f; }
function enter(s) {
  const f = load(s); if (!f) return;
  const send = () => f.contentWindow.postMessage({type: 'enter', step: shown(s)}, '*');
  if (f.dataset.ready) send(); else f.addEventListener('load', () => { f.dataset.ready = 1; send(); }, {once: true});
}
function near() { const a = all(), i = a.indexOf(Reveal.getCurrentSlide()); [a[i], a[i + 1]].forEach(s => s && load(s)); }
function notes() { const s = Reveal.getCurrentSlide(), i = all().indexOf(s), n = shown(s);
  document.getElementById('pts').innerHTML = POINTS[i].map((t, j) => j === 0 ? '<b>' + t + '</b>' : '<div class="' + (j <= n ? 'on' : '') + '">' + j + '. ' + t + '</div>').join(''); }
Reveal.on('ready', e => { near(); enter(e.currentSlide); notes(); });
Reveal.on('slidechanged', e => { near(); enter(e.currentSlide); notes(); });
const sync = () => { const s = Reveal.getCurrentSlide(), f = frame(s); if (f && f.contentWindow) f.contentWindow.postMessage({type: 'step', step: shown(s)}, '*'); notes(); };
Reveal.on('fragmentshown', sync); Reveal.on('fragmenthidden', sync);
addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') { const p = document.getElementById('pts'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; } });
</script></body></html>
