<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><title>{{title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../runtime/scene.css">
</head><body data-cues='[0.1, 0.6]'>
<!-- Generated by build.mjs from templates/outro.html and deck.json "presenter". Edits here are overwritten:
     change deck.json, or remove "template" from the slide to make this file your own. -->
<!-- Outro: the intro's picture, nearly still. Wordmark and sign-off fade in (cue 1, 2), centred; the presenter's name and photo are left to the intro. Plays once. -->
<div id="frame">
  <div class="layer on" data-place="{{id}}">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <style>text{font-family:Kalam,"Comic Neue",cursive}</style>
      <rect id="bg" width="1920" height="1080" fill="#FFFFFF"/>
      <text id="brand-text" x="960" y="600" text-anchor="middle" font-size="260" font-weight="700" fill="#2A2420" opacity="0">{{wordmark}}</text>
      <path id="brand-underline" d="M625 640C720 656 820 632 920 646S1170 636 1295 644" fill="none" stroke="#F07A1A" stroke-width="12" stroke-linecap="round" opacity="0"/>
      <text id="brand-signoff" x="960" y="740" text-anchor="middle" font-size="68" font-weight="700" fill="#F07A1A" opacity="0">{{signoff}}</text>
    </svg>
  </div>
  <div id="cap"></div>
</div>
<script src="../runtime/motion.js"></script>
<script>
M.captions({{caption}});   // the sign-off line
const A = M.layer('{{id}}');
const fade = (id, cue, d = .5) => A.track(id, t => { const a = M.since(cue); return { o: a < 0 ? 0 : M.clamp(a / d) }; });
fade('brand-text', 1); fade('brand-underline', 1); fade('brand-signoff', 2);
</script>
<script>M.start();</script>
</body></html>
