<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><title>{{title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../runtime/scene.css">
</head><body data-cues='[0.4, 1.6, 5.2]'>
<!-- Generated by build.mjs from templates/intro.html and deck.json "presenter". Edits here are overwritten:
     change deck.json, or remove "template" from the slide to make this file your own. -->
<!-- Intro: the robot flies in (cue 1), writes the brand name (cue 2), underlines it, hops aside and waves (cue 3). Plays once, then rests. -->
<div id="frame">
  <div class="layer on" data-place="{{id}}">
    <svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <style>text{font-family:Kalam,"Comic Neue",cursive}</style>
      <defs><clipPath id="brand-clip"><rect id="brand-clip-rect" x="0" y="0" width="0" height="0"/></clipPath></defs>
      <rect id="bg" width="1920" height="1080" fill="#FFFFFF"/>
      <path id="ground" d="M120 905C600 900 1300 910 1800 903" fill="none" stroke="#D9D4CC" stroke-width="4" stroke-linecap="round"/>
      <g id="brand" clip-path="url(#brand-clip)">
        <text id="brand-text" x="860" y="720" text-anchor="middle" font-size="250" font-weight="700" fill="#2A2420">{{brand}}</text>
      </g>
      <path id="brand-underline" d="M0 0" fill="none" stroke="#F07A1A" stroke-width="12" stroke-linecap="round"/>
      <text id="brand-tagline" x="860" y="880" text-anchor="middle" font-size="56" fill="#2A2420" opacity="0">{{tagline}}</text>
      {{robot}}
    </svg>
  </div>
  <div id="cap"></div>
</div>
<script src="../runtime/motion.js"></script>
<script src="../runtime/brand.js"></script>
<script>
M.captions({{caption}});   // the presenter's name and brand
brandWrite(M.layer('{{id}}'), { steps: { fly: 1, write: 2, rest: 3 }, rest: [1660, 860] });
</script>
<script>M.start();</script>
</body></html>
